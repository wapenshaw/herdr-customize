[package]
name = "herdr-customize"
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
description = "The Customize screen for the Herdr desktop app: themes, keys, mods, layouts, popups, programs and settings, without hand-editing JSON. Linux, macOS and Windows."
license = "MIT"
homepage = "https://github.com/wapenshaw/herdr-customize?tab=readme-ov-file"
authors = ["Siddharth Abbineni <contact@siddharthabbineni.in>"]
readme = "README.md"
repository = "https://github.com/wapenshaw/herdr-customize"
publish = false

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

# Beyond clippy's defaults; CI denies warnings, so these hold there too.
[lints.clippy]
derive_partial_eq_without_eq = "warn"
manual_ok_or = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
