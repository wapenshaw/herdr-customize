id = "herdr-customize"
name = "Herdr Customize"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Customize Herdr from a popup: themes today; plugins, keybindings and settings next."
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["go", "build", "-trimpath", "-ldflags=-s -w", "-o", "herdr-customize", "./cmd/herdr-customize"]

[[build]]
platforms = ["windows"]
command = ["go", "build", "-trimpath", "-ldflags=-s -w", "-o", "herdr-customize.exe", "./cmd/herdr-customize"]

[[panes]]
id = "picker"
title = "Herdr Customize"
placement = "popup"
width = "80%"
height = "70%"
command = ["./herdr-customize", "picker"]

[[actions]]
id = "open"
title = "Customize: themes"
contexts = ["workspace"]
command = ["./herdr-customize", "open"]

[[actions]]
id = "sync"
title = "Customize: sync terminal colors"
contexts = ["global"]
command = ["./herdr-customize", "sync"]
