id = "herdr-customize"
name = "Herdr Customize"
version = "0.7.0"
min_herdr_version = "0.8.0"
description = "Themes, plugins, keybindings and settings for Herdr, all from one popup. No more hunting for config files or hand-editing TOML. Linux, macOS and Windows."
platforms = ["linux", "macos", "windows"]

# Installs the release binary for this version, or builds from source with
# cargo when there is none. `herdr plugin link` skips this step; run
# `cargo build --release` yourself in a linked checkout.
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-or-build.ps1"]

# Syncs each Herdr window that appears in the 10 seconds after the server
# starts, so the one that started it gets the colors back, then exits.
[[startup]]
platforms = ["linux", "macos"]
command = ["./target/release/herdr-customize", "sync", "--startup"]

[[startup]]
platforms = ["windows"]
command = ["./target/release/herdr-customize.exe", "sync", "--startup"]

# One entrypoint per page; tab moves between pages once the popup is open.
[[panes]]
id = "themes"
title = "Herdr Customize"
placement = "popup"
width = "80%"
height = "70%"
command = ["./target/release/herdr-customize", "ui", "themes"]

[[panes]]
id = "plugins"
title = "Herdr Customize"
placement = "popup"
width = "80%"
height = "70%"
command = ["./target/release/herdr-customize", "ui", "plugins"]

[[panes]]
id = "keys"
title = "Herdr Customize"
placement = "popup"
width = "80%"
height = "70%"
command = ["./target/release/herdr-customize", "ui", "keys"]

[[panes]]
id = "settings"
title = "Herdr Customize"
placement = "popup"
width = "80%"
height = "70%"
command = ["./target/release/herdr-customize", "ui", "settings"]

[[actions]]
id = "open"
title = "Customize"
contexts = ["workspace"]
command = ["./target/release/herdr-customize", "open", "settings"]

[[actions]]
id = "themes"
title = "Customize: themes"
contexts = ["workspace"]
command = ["./target/release/herdr-customize", "open", "themes"]

[[actions]]
id = "plugins"
title = "Customize: plugins"
contexts = ["workspace"]
command = ["./target/release/herdr-customize", "open", "plugins"]

[[actions]]
id = "keys"
title = "Customize: keybindings"
contexts = ["workspace"]
command = ["./target/release/herdr-customize", "open", "keys"]

[[actions]]
id = "settings"
title = "Customize: settings"
contexts = ["workspace"]
command = ["./target/release/herdr-customize", "open", "settings"]

# Herdr binds no keys from manifests, so a new install runs this once:
# herdr plugin action invoke bind --plugin herdr-customize
[[actions]]
id = "bind"
title = "Customize: bind prefix+t to the popup"
contexts = ["global"]
command = ["./target/release/herdr-customize", "bind"]

[[actions]]
id = "sync"
title = "Customize: sync terminal colors"
contexts = ["global"]
command = ["./target/release/herdr-customize", "sync"]
